name: Auto Build and Release

on:
  push:
    branches:
      - master
      - release-v1.19.9
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Package artifacts
        run: |
          zip -r dist.zip dist/*

      # 动态生成 Tag（关键修复点）
      - name: Generate Tag
        id: generate-tag
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "生成动态 Tag..."
            COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
            DATE=$(date +%Y%m%d)
            TAG_NAME="auto-$DATE-$COMMIT_SHA_SHORT"
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            # 自动创建并推送 Tag
            git tag $TAG_NAME
            git push origin $TAG_NAME
          else
            echo "使用已有 Tag: ${{ github.ref_name }}"
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.generate-tag.outputs.tag_name }}  # 明确指定动态生成的 Tag
          name: Release ${{ steps.generate-tag.outputs.tag_name }}
          body: |
            Automated release for commit ${{ github.sha }}
            Changelog:
            ${{ github.event.head_commit.message }}
          files: dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 确保 MY_TOKEN 有足够权限