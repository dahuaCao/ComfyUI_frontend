name: Auto Build and Release1

# 添加全局权限配置
permissions:
  contents: write  # 关键权限

on:
  push:
    branches:
      - master
      - release-v1.19.9
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整提交历史，确保 Tag 可追溯

      - name: Generate Tag
        id: generate-tag
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "生成动态 Tag..."
            COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
            DATE=$(date +%Y%m%d)
            TAG_NAME="auto-$DATE-$COMMIT_SHA_SHORT"
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            # 推送 Tag 时使用 Token 认证
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git tag $TAG_NAME
            git push origin $TAG_NAME
          else
            echo "使用已有 Tag: ${{ github.ref_name }}"
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.generate-tag.outputs.tag_name }}
          name: Release ${{ steps.generate-tag.outputs.tag_name }}
          files: dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}  # 或 secrets.MY_TOKEN