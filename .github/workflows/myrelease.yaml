
name: Auto Build and Release
on:
  push:
    branches:
      - master
      - release-v1.19.9
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 步骤 1：拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2：设置构建环境（示例为 Node.js，其他语言需调整）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # 步骤 3：安装依赖并构建（根据项目调整命令）
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # 步骤 4：打包构建产物（示例生成 dist.zip）
      - name: Package artifacts
        run: |
          zip -r dist.zip dist/*  # 打包 dist 目录
          echo "RELEASE_VERSION=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
      
      # 动态生成 Tag（若无 Tag）
      - name: Generate Tag
        id: tag
        run: |
          if [ -z "${{ github.ref_type }}" ] || [ "${{ github.ref_type }}" != "tag" ]; then
            echo "生成动态 Tag..."
            COMMIT_SHA_SHORT=$(git rev-parse --short HEAD)
            DATE=$(date +%Y%m%d)
            echo "tag_name=auto-$DATE-$COMMIT_SHA_SHORT" >> $GITHUB_OUTPUT
          else
            echo "使用已有 Tag: ${{ github.ref_name }}"
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      # 步骤 5：创建 GitHub Release 并上传产物
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # 自动生成 Release 名称和内容
          name: Release ${{ env.RELEASE_VERSION }}
          body: |
            Automated release for commit ${{ github.sha }}
            Changelog:
            ${{ github.event.head_commit.message }}
          files: |
            dist.zip  # 上传的产物
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.MY_TOKEN }}